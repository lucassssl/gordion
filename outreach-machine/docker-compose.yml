services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gordion_outreach
      POSTGRES_USER: gordion
      POSTGRES_PASSWORD: gordion-local-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - gordion_outreach_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gordion -d gordion_outreach"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gordion_outreach_pg:
